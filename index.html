$('#ts').onclick=async()=>{try{const r=await(await fetch(CFG.TMDB_PROXY_URL+'?q='+encodeURIComponent($('#tq').value))).json();$('#tr').innerHTML=r.map((x,i)=>`<button type="button" class="btn sm ghost" data-t="${i}">${esc(x.title)} (${esc(x.year)})</button>`).join(' ');$('#tr').onclick=e=>{const x=r[e.target.dataset.t];if(!x)return;const s=(k,v)=>f.elements[k].value=Array.isArray(v)?v.join(', '):(v??'');

function toggle(k,id){const u=Auth.user();if(!u){Auth.need();return}const a=DB.get(k,{}),l=a[u.email]||[],i=l.indexOf(id);i<0?l.push(id):l.splice(i,1);a[u.email]=l;DB.set(k,a);SB.list(k,id,i<0);toast(i<0?'Added':'Removed');return i<0}
